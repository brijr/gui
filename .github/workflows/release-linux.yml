# Builds Gui for Linux from a release's tag and publishes it next to the Mac build. scripts/
# release.sh publishes the Mac build, pushes the tag and creates the GitHub Release; that release
# starts this workflow. Run it again by hand (Actions → Release Linux → Run workflow, or
# `gh workflow run release-linux.yml -f tag=v<version>`) for the newest release only:
# scripts/publish-linux.sh refuses a version the Mac feed doesn't name.
#
# Each architecture builds on its own runner (node-pty compiles for the runner's architecture)
# and is checked before anything is uploaded: the packaged modules load and the AppImage starts,
# shows its window and quits cleanly. Only then does the publish job, the one job with the
# R2 secrets, upload both to the gui-releases R2 bucket and attach them to the release.
name: Release Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish, such as v0.1.0-alpha.22
        required: true
        type: string

permissions: {}

# One publish at a time for every tag, so an older tag can't write the feeds after a newer one.
concurrency:
  group: release-linux
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            appimage: x86_64
            unpacked: linux-unpacked
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage: arm64
            unpacked: linux-arm64-unpacked
    steps:
      - name: Check the tag
        run: |
          echo "$TAG" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' ||
            { echo "::error::$TAG isn't a version tag such as v0.1.0-alpha.22."; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Check the version
        run: |
          version=$(jq -r .version package.json)
          [ "v$version" = "$TAG" ] ||
            { echo "::error::package.json at $TAG says $version, not ${TAG#v}."; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # scripts/check-packaged-app.sh imports the packaged modules with the system's node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # xvfb for the launch check; FUSE 3 mounts the AppImage, as on a desktop.
      - name: Install xvfb and FUSE
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth fuse3

      - run: bun install --frozen-lockfile

      - run: bun run check

      # Official: asks for a Gui account, takes updates and sends crash reports
      # (src/main/official-build.ts), as scripts/release.sh builds the Mac app.
      - name: Build
        run: GUI_OFFICIAL_BUILD=1 bun run build

      - name: Package
        run: bun x --bun electron-builder --linux --${{ matrix.arch }} --publish never

      - name: Check the package
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage }}
          UNPACKED: ${{ matrix.unpacked }}
        run: |
          ls -l release
          sh scripts/check-packaged-app.sh "release/$UNPACKED"
          xvfb-run -a bun scripts/check-launch.ts "release/Gui-$VERSION-$APPIMAGE_ARCH.AppImage"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            release/Gui-*.AppImage
            release/Gui-*.deb
            release/*-linux*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # gh release upload
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.AppImage *.deb | tee SHA256SUMS

      - name: Publish to usegui.com
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: sh scripts/publish-linux.sh dist "${TAG#v}"

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.AppImage dist/*.deb dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
