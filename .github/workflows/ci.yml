name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Playwright and electron-vite run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # The e2e global setup runs `bun install` in each fixture when node_modules is missing.
      - name: Cache E2E fixture dependencies
        uses: actions/cache@v4
        with:
          path: e2e/fixtures/*/node_modules
          key: e2e-fixtures-${{ runner.os }}-${{ hashFiles('e2e/fixtures/*/package.json', 'e2e/fixtures/*/bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

      # Builds the app, then runs the Playwright suite against it. Agent turns need a real
      # agent login and stay skipped (GUI_E2E_AGENT is not set).
      - run: bun run test:e2e

      - name: Upload E2E results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
