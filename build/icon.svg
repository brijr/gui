<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Placeholder app icon. Rasterized to icon.png / icon.icns by build/make-icon.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34363D"/>
      <stop offset="1" stop-color="#141519"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC861"/>
      <stop offset="1" stop-color="#FF7A2F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9A45" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF9A45" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS icon grid: 824pt squircle-ish tile centered on a 1024 canvas, soft drop shadow -->
  <rect x="104" y="108" width="816" height="824" rx="186" fill="#000000" opacity="0.10"/>
  <rect x="100" y="112" width="824" height="824" rx="188" fill="#000000" opacity="0.10"/>
  <rect x="96" y="118" width="832" height="826" rx="192" fill="#000000" opacity="0.06"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- accent sparkle -->
  <circle cx="676" cy="352" r="150" fill="url(#glow)"/>
  <path transform="translate(676 352)" fill="url(#spark)"
        d="M0,-84 C9,-22 22,-9 84,0 C22,9 9,22 0,84 C-9,22 -22,9 -84,0 C-22,-9 -9,-22 0,-84 Z"/>
  <path transform="translate(774 476)" fill="url(#spark)" opacity="0.85"
        d="M0,-34 C4,-9 9,-4 34,0 C9,4 4,9 0,34 C-4,9 -9,4 -34,0 C-9,-4 -4,-9 0,-34 Z"/>

  <!-- pointer cursor -->
  <g transform="translate(330 290)">
    <path transform="translate(0 14)" fill="#000000" opacity="0.35" stroke="#000000" stroke-opacity="0.35"
          stroke-width="26" stroke-linejoin="round"
          d="M0,0 L0,372 L90,286 L156,440 L216,415 L153,266 L270,266 Z"/>
    <path fill="#FFFFFF" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"
          d="M0,0 L0,372 L90,286 L156,440 L216,415 L153,266 L270,266 Z"/>
  </g>
</svg>
